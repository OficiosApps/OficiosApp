<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | Oficios</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #fbfaf5; color: #16332d; padding: 24px;
        font-family: "Manrope", ui-sans-serif, system-ui, sans-serif; text-align: center;
      }
      .card {
        max-width: 26rem; background: #fff; border: 1px solid #e3e6dd;
        border-radius: 20px; padding: 32px; box-shadow: 0 18px 40px -24px rgba(22, 51, 45, 0.35);
      }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: #5b6a63; line-height: 1.55; margin: 0; }
      a {
        display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: 12px;
        background: #1c4f45; color: #fff; text-decoration: none; font-weight: 600;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Oficios" width="64" height="64" />
      <h1>Estás sin conexión</h1>
      <p>No pudimos cargar esta pantalla. Revisá tu conexión e intentá de nuevo. Tus pedidos guardados van a seguir disponibles cuando vuelvas a conectarte.</p>
      <a href="/">Volver al inicio</a>
    </div>
  </body>
</html>
